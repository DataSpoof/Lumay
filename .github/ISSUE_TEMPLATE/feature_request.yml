name: Feature request
description: Propose a change to what the API does
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that the API makes hard today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Include the endpoint shape you have in mind, if you have one.
    validations:
      required: true

  - type: checkboxes
    id: breaking
    attributes:
      label: Compatibility
      options:
        - label: This would change the existing API contract
